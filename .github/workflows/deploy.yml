name: deploy

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      simulate_deploy_failure:
        description: "존재하지 않는 이미지로 롤백 테스트"
        required: true
        type: boolean
        default: false

concurrency:
  group: user-production
  cancel-in-progress: false
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test-and-coverage-sonarqube:
    runs-on: ubuntu-latest

    outputs:
      coverage_result: ${{ steps.coverage.outcome }}
      coverage_percentage: ${{ steps.sonar_metrics.outputs.coverage_percentage }}
      coverage_threshold: ${{ steps.sonar_metrics.outputs.coverage_threshold }}

    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - uses: ./.github/actions/setup-test-env

      - name: Run tests
        run: ./mvnw -B clean test

      - name: Check JaCoCo 40% coverage
        id: coverage
        run: ./mvnw -B -DskipTests verify

      - name: Run SonarQube Quality Gate
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Read SonarQube coverage
        id: sonar_metrics
        if: always()
        env:
          SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ANALYSIS_OUTCOME: ${{ steps.sonar.outcome }}
        run: bash .github/scripts/sonar.sh

  build-and-push:
    needs: test-and-coverage-sonarqube
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image.outputs.name }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 이미지 이름 소문자로 변환
        id: image
        run: |
          echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  request-central-deploy:
    needs: [test-and-coverage-sonarqube, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create Config GitHub App token
        id: config-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Config
          permission-contents: write

      - name: Request Config deployment
        env:
          GH_TOKEN: ${{ steps.config-app-token.outputs.token }}
          CONFIG_REPOSITORY: ${{ github.repository_owner }}/Config

          SERVICE_NAME: ai-server
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          SOURCE_ACTOR: ${{ github.actor }}
          SOURCE_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          QUALITY_RESULT: ${{ needs.test-and-coverage-sonarqube.result }}
          COVERAGE_RESULT: ${{ needs.test-and-coverage-sonarqube.outputs.coverage_result }}
          COVERAGE_PERCENTAGE: ${{ needs.test-and-coverage-sonarqube.outputs.coverage_percentage }}
          COVERAGE_THRESHOLD: ${{ needs.test-and-coverage-sonarqube.outputs.coverage_threshold }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          SONAR_URL: ${{ vars.SONAR_DASHBOARD_URL }}
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_deploy_failure || false }}

        run: bash .github/scripts/config-deployment.sh