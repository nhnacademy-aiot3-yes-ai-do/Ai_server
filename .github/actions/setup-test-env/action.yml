name: Setup test env
description: CI 테스트용 DB/JWT 환경변수 설정
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "DB_HOST=localhost" >> "$GITHUB_ENV"
        echo "DB_PORT=5432" >> "$GITHUB_ENV"
        echo "DB_NAME=testdb" >> "$GITHUB_ENV"
        echo "DB_USERNAME=test" >> "$GITHUB_ENV"
        echo "DB_PASSWORD=test1234" >> "$GITHUB_ENV"
        echo "Auth_DB_SCHEMA=public" >> "$GITHUB_ENV"
        echo "JWT_SECRET=test-jwt-secret-for-ci-only-please-ignore" >> "$GITHUB_ENV"
        echo "JWT_ACCESSTOKEN_EXPIRATION_MS=100000" >> "$GITHUB_ENV"
        echo "JWT_REFRESHTOKEN_EXPIRATION_MS=200000000" >> "$GITHUB_ENV"