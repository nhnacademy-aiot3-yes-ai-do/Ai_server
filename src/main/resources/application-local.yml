server:
  port: 8080

spring:
  cloud:
    openfeign:
      client:
        config:
          vision-client:
            connect-timeout: 5000
            read-timeout: 120000

eureka:
  client:
    enabled: false

vision:
  server:
    url: "http://localhost:8000"

minio:
  endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
  access-key: "${MINIO_ACCESS_KEY:mushroom-local}"
  secret-key: "${MINIO_SECRET_KEY:mushroom-local-secret}"
  bucket-name: "${MINIO_BUCKET:mushroom-photos}"
